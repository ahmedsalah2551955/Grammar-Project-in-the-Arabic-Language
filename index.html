<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>نَحْو — منصة النحو العربي</title>
  <meta name="description" content="منصة تفاعلية لتعلّم النحو العربي لطلاب الصف الثالث الإعدادي: شرح واضح، تدريب متدرّج، ومتابعة للتقدم.">
  <meta name="theme-color" content="#0f766e">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="نَحْو">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <script>
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('nahw.v1') || '{}');
        var theme = saved && saved.settings && saved.settings.theme ? saved.settings.theme : 'system';
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
</head>
<body>
  <a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>

  <div class="app-shell">
    <header class="topbar">
      <div class="container topbar__inner">
        <a class="brand" href="#/" aria-label="نَحْو — الصفحة الرئيسية">
          <span class="brand__mark" aria-hidden="true"><span>ن</span></span>
          <span class="brand__text">
            <strong>نَحْو</strong>
            <small>منصة النحو العربي</small>
          </span>
        </a>

        <nav class="topnav" aria-label="التنقل الرئيسي">
          <a class="topnav__link" href="#/" data-nav="home">الرئيسية</a>
          <a class="topnav__link" href="#/dashboard" data-nav="dashboard">تقدّمي</a>
          <a class="topnav__link" href="#/exam" data-nav="exam">اختبار مختلط</a>
          <a class="topnav__link" href="#/mistakes" data-nav="mistakes">أخطائي</a>
          <a class="topnav__link" href="#/settings" data-nav="settings">الإعدادات</a>

        <div class="topbar__actions">
          <button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="تبديل المظهر" title="تبديل المظهر">
            <span data-theme-icon aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>

    <main id="main" class="app-main" tabindex="-1">
      <div class="page container">
        <div class="route-loading" role="status">
          <span class="route-loading__dot"></span>
          <span>جارٍ تجهيز الصفحة…</span>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container site-footer__inner">
        <p class="site-footer__brand"><span aria-hidden="true">ن</span> نَحْو <span class="site-footer__dot">·</span> منصة النحو العربي</p>
        <p class="site-footer__note">صُمّمت لطلاب الصف الثالث الإعدادي، وتعمل دون اتصال.</p>
      </div>
    </footer>

    <nav class="bottom-nav" aria-label="التنقل السفلي">
      <a class="bottom-nav__item" href="#/" data-nav="home">
        <span class="bottom-nav__icon" data-icon="home" aria-hidden="true"></span>
        <span class="bottom-nav__label">الرئيسية</span>
      </a>
      <a class="bottom-nav__item" href="#/dashboard" data-nav="dashboard">
        <span class="bottom-nav__icon" data-icon="chart" aria-hidden="true"></span>
        <span class="bottom-nav__label">تقدّمي</span>
      </a>
      <a class="bottom-nav__item" href="#/exam" data-nav="exam">
        <span class="bottom-nav__icon" data-icon="clock" aria-hidden="true"></span>
        <span class="bottom-nav__label">اختبرني</span>
      </a>
      <a class="bottom-nav__item" href="#/mistakes" data-nav="mistakes">
        <span class="bottom-nav__icon" data-icon="alert" aria-hidden="true"></span>
        <span class="bottom-nav__label">أخطائي</span>
      </a>
      <a class="bottom-nav__item" href="#/settings" data-nav="settings">
        <span class="bottom-nav__icon" data-icon="settings" aria-hidden="true"></span>
        <span class="bottom-nav__label">الإعدادات</span>
      </a>
    </nav>
  </div>

  <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="false"></div>
  <div id="route-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

  <noscript>

      تحتاج هذه المنصة إلى تشغيل جافاسكربت في المتصفح لعرض الدروس والتدريبات.
    </div>

</body>
</html>
